<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 420px; max-height: 560px; overflow-y: auto; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #e8e8e8; background: #1b1f24; }
  h1 { font-size: 14px; padding: 10px 14px 8px; color: #9fd89f; }
  .tabs { display: flex; border-bottom: 1px solid #333; }
  .tabs button { flex: 1; padding: 8px 0; background: none; border: none; color: #889; cursor: pointer; font-size: 13px; }
  .tabs button.active { color: #fff; border-bottom: 2px solid #7db87d; }
  .page { display: none; padding: 10px 14px 14px; }
  .page.active { display: block; }
  .cap { padding: 6px 8px; border-bottom: 1px solid #2a2f36; font-size: 12px; }
  .cap .u { color: #bcd; word-break: break-all; }
  .cap .m { color: #677; font-size: 11px; }
  .btn { display: inline-block; padding: 6px 12px; margin: 4px 4px 0 0; background: #2f6d2f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #3a853a; }
  .btn.gray { background: #3a4149; }
  .btn.gray:hover { background: #465059; }
  .btn:disabled { opacity: .4; cursor: default; }
  label { display: block; margin: 8px 0 3px; color: #99a; font-size: 12px; }
  select, input[type="number"], textarea { width: 100%; padding: 5px 7px; background: #12161a; color: #dde; border: 1px solid #333; border-radius: 4px; font-size: 12px; }
  textarea { height: 64px; resize: vertical; }
  #detected { font-size: 12px; color: #9ab; margin-top: 4px; white-space: pre-wrap; }
  #progress { margin-top: 8px; font-size: 12px; color: #fd8; white-space: pre-wrap; }
  #status { margin-top: 6px; font-size: 12px; color: #8c8; }
  .foot { padding: 6px 14px 10px; font-size: 10.5px; color: #566; }
  input[type="file"] { color: #889; font-size: 11px; margin-top: 4px; }
  .count { color: #7db87d; }
</style>
</head>
<body>
  <h1>Font Toolkit <span style="font-weight:normal;color:#667">— 网页字体抓取（研究用途）</span></h1>
  <div class="tabs">
    <button data-tab="cap" class="active">捕获</button>
    <button data-tab="full">全量抓取</button>
  </div>

  <div class="page active" id="page-cap">
    <div id="capList"><div class="cap" style="color:#667">本会话尚未捕获字体请求。浏览含字体的页面后重新打开。</div></div>
    <button class="btn" id="btnZipCap">打包 ZIP 下载</button>
    <button class="btn gray" id="btnEachCap">逐个下载</button>
    <button class="btn gray" id="btnClear">清空记录</button>
  </div>

  <div class="page" id="page-full">
    <button class="btn" id="btnDetect">探测当前页字体服务</button>
    <div id="detected">探测 justfont 动态字型服务的站点 ID 与家族/字重配置。</div>
    <label>字体（fn，含字重后缀）</label>
    <select id="family"><option value="jf-lanyanghei-bold">jf-lanyanghei-bold (weight 700)</option></select>
    <label>站点 ID（p）</label>
    <input type="text" id="siteId" placeholder="自动探测，如 58317" style="width:100%">
    <label>字符字表</label>
    <select id="charset"></select>
    <label>或自定义字符（叠加在所选字表之上）</label>
    <textarea id="custom" placeholder="粘贴任意字符…"></textarea>
    <input type="file" id="fileIn" accept=".txt">
    <label>单批字符数上限（动态 API 约 1700/批）</label>
    <input type="number" id="batchSize" value="1700" min="100" max="2000">
    <button class="btn" id="btnHarvest">开始全量抓取</button>
    <button class="btn gray" id="btnAbort" disabled>中止</button>
    <div id="progress"></div>
    <div id="status"></div>
  </div>

  <div class="foot">仅供字体学习研究。抓取与后续使用须遵守各字体厂商服务条款与授权协议。</div>

  <script src="charsets.js"></script>
  <script src="zip.js"></script>
  <script src="popup.js"></script>
</body>
</html>
